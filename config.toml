# California topo puzzle — build configuration
# All geometry parameters live here; scripts in pipeline/ read this file.

[regions]
# Coast piece = shoreline-contiguous land at/below this elevation (meters),
# excluding the Great Valley. THE knob for the coast/mountains border.
# Candidates rendered side-by-side by p1_regions.py; pick at P1 check-in.
coast_threshold_m = 25
coast_candidates_m = [200, 300, 400]

# Every region must be ONE connected component (coast: judged on the
# mainland; offshore islands join the coast piece via the printed ocean
# shelf, D2). Minor fragments are reassigned to the neighboring region
# that borders them most. Also kills exclaves (P2 no-exclave contract).
enforce_contiguous = true

# Minimum shoreline band (km): mainland within this distance of the ocean
# is Coast regardless of elevation, keeping the strip continuous where
# mountains meet the sea (Big Sur, Lost Coast). 0 disables.
# 13.5 km — ahl's final pick (2026-09-13): "a nice balance".
coast_band_km = 13.5

# Offshore islands below this latitude belong to Mexico (Coronados, Todos
# Santos), not the Coast piece. Interim rule until the Census state
# polygon is wired in (P2).
island_min_lat = 32.6

# Morphological smoothing radius applied to region masks (km). Keeps the
# puzzle borders printable; final per-scale min-width pass comes later.
smooth_radius_km = 2.0

# Coast cells within this distance (km) of the Great Valley are absorbed
# INTO the valley region — stops the shoreline band curling through the
# Delta toward Sacramento (ahl, 2026-09-13: "explicitly subtract out the
# valley region"). 0 disables.
valley_absorb_km = 7.5

# Land fully enclosed by the valley region becomes valley (fills Delta
# enclaves left by absorption; also absorbs Sutter Buttes).
valley_fill_enclosed = true

# Lowland (m) connected to the Great Valley floor is valley — reclaims
# the Delta, which CGS files under its "Coastline SubProvince" and which
# the Carquinez gate correctly keeps out of Coast. Only Mountains cells
# are reassigned (never Coast/Desert). 0 disables.
valley_lowland_m = 50

# The shoreline band only emanates from open water at least ~2x this wide
# (km): rivers and Delta channels don't generate coastal band, bays and
# ocean do.
band_source_min_width_km = 1.5

# "Coastal water" = Pacific + SF Bay + San Pablo Bay, CUT at the
# Carquinez Strait (ahl, 2026-09-13): water east of this barrier line
# ([lon, lat] endpoints across the strait) generates no coastal band.
coastal_water_gate = [[-122.20, 38.02], [-122.20, 38.10]]

# Desert cells north of this line (km, CA Albers y) become Mountains:
# the northern Basin and Range (Modoc country) reads as mountains, not
# desert (ahl, 2026-09-13, marked on p0_map_area_relief).
desert_north_limit_km = 100

# CGS province -> region grouping (RANGE_NAME values)
valley_provinces = ["Great Valley"]
desert_provinces = ["Mojave Desert", "Colorado Desert", "Basin and Range"]
# everything else in CA defaults to Mountains; Coast is carved by elevation

[overrides]
# Hand-drawn region-edge barriers (extracted from ahl's markups; EPSG:3310
# LineStrings). Each line CUTS the coast and valley masks; fragments
# severed from their region's main body become Mountains, and the line's
# own footprint goes to Mountains. Endpoints are auto-sealed to the
# nearest sea/mountains cell (<=20 km).
mountain_edges = ["overrides/vallejo_mountain_edges.geojson"]
# Polygon marks with a per-feature "target" property ("mountains" or
# "coast"): the area's coast/valley/mountains cells are reassigned to the
# target (ahl's p1_final markup: red=mountains, orange=coast).
region_marks = ["overrides/p1final_marks.geojson"]

[output]
# Final product size (ahl 2026-09-14): total N-S = 250 mm — was 254
# (10 in); reduced to leave a few mm of bed for a BRIM. With the D13
# window (CA + 40 km N/E/S + 67.5 km ocean west, 1021.5 x 1135 km) this
# gives scale 1:4.540M, footprint 225.0 x 250.0 mm, California
# ~232 mm N-S. The 420 mm variant is SET ASIDE for now.
total_ns_mm = 250.0

# Vertical exaggeration (G2, normalized 2026-09-14): terrain z = true
# height x this factor x the horizontal scale. Constant and
# grid-independent — replaces the earlier "5 mm at CA max per 150 mm"
# rule, whose CA-max sample varied with grid resolution. 9.3 is the
# value ahl print-validated on the P1.5 slab.
z_exaggeration = 9.3

# Iteration tag for the bottom stamps. Bump per test iteration.
build_tag = "T3"
# Bottom version stamps DISABLED per ahl 2026-09-14 ("the lettering on
# the bottom is still wrong; just remove it for now") — parts get flat
# plain bottoms until the stamp rendering is revisited.
stamps_enabled = false

[edge_stamp]
# Attribution + version, DEBOSSED into the frame's outer side wall
# (ahl 2026-09-15). Deliberately subtle -- "really subtle; like barely
# visible": it should read as a shadow line in raking light, not as a
# label.
#
# RECESSED, not raised. On a vertical wall at this size a proud feature
# would be under one nozzle width (so it prints mushy or not at all) and
# would be the first thing to chip on the outermost rim. A notch of the
# same depth is reliable: the wall stays continuous and the slicer just
# carves it.
enabled = true
text = "AL&JL 2026 v1.0"
# A simple sans, and it must be BOLD: at 2.0 mm cap the thinnest stroke
# has to clear a 0.4 mm nozzle or the nozzle cannot enter the recess.
# Measured on what is actually installed here:
#     Tahoma Bold        0.45 mm  23.0 mm wide   <- chosen, most compact
#     Verdana Bold       0.45 mm  25.8 mm
#     Georgia Bold       0.45 mm  25.1 mm  (serif)
#     Trebuchet MS Bold  0.35 mm  -- too thin
#     Arial Bold         0.35 mm  -- too thin
# WARNING: the font lookup SILENTLY falls back to Times New Roman Bold
# for any name it cannot resolve, so "Helvetica"/"Futura"/"DejaVu Sans"
# all quietly become a serif. The build now prints the font FILE it
# actually used -- check it after changing this.
font = "Tahoma Bold"
cap_mm = 2.0
# Depth is an XY move (the wall is vertical and the frame prints flat),
# so it can be far finer than the 0.4 mm stroke width. 0.3 = clearly
# visible, 0.2 = subtle shadow line, 0.15 = very faint and may partly
# fill in; below that it will likely vanish into extrusion variation.
depth_mm = 0.2
# Which outer edge, and how far along it from the left/bottom end. The
# 0..base_mm band is floor + water around the WHOLE perimeter -- even
# where land meets the edge, since terrain sits above the datum -- so
# any edge works.
edge = "south"
offset_mm = 18.0

[print]
# Physical print parameters — shared by the P4 coupon AND the P5 final
# build, so coupon-validated values transfer 1:1.
#
# ============================ LOCKED ============================
# The FIT NUMBERS below are SETTLED as of the T3 coupon print
# (ahl 2026-09-15: "the T3 fit is great. I don't think I'd change it at
# all"). Three generations got here -- T1 loose, T2 too tight, T3 right
# -- so do NOT casually re-tune them; a change means a new coupon print
# and a new build_tag. What T3 actually exercised: the P4 coupon, i.e.
# MOUNTAINS + VALLEY + FRAME at final scale. Still unproven at P5:
# desert, three-piece wedging, and the full 225 x 250 frame.
#   piece <-> frame : 0.10 total (piece shrinks; cavity is nominal)
#   piece <-> piece : 0.20 total (0.10 each, symmetric)
#   crush ribs      : r0.4 mm, 0.05 mm bite INTO the mating face
# ================================================================
clearance_per_side_mm = 0.10  # LOCKED T3. Piece shrink vs the FRAME
                              # (frame = nominal, so this IS the whole
                              # gap). Was 0.15 through T1+T2 ("pretty
                              # locked in"); 0.10 relies on the ribs for
                              # retention and does not bind.
clearance_pair_per_side_mm = 0.10   # LOCKED T3. Piece shrink along
                              # PIECE-PIECE borders, contributed by BOTH
                              # sides -> 0.20 total. History: 0.15/side
                              # symmetric (T1) = 0.30 -> loose valley;
                              # 0.08 with the valley taking ZERO (T2)
                              # = 0.08 -> too tight TOGETHER, and the
                              # pair ribs were jamming hard because
                              # valley sat exactly on the nominal line.
enclosed_piece_zero_clearance = false  # LOCKED T3. No valley exception:
                              # both pieces contribute symmetrically.
                              # Under the old rule 100% of the pair gap
                              # (and of the relief at the fragile
                              # Petaluma spur) came off mountains alone.
                              # History: true for T2 only.
base_mm = 3.0                 # water surface height above print bottom
floor_mm = 1.2                # tray floor under everything (D16)
bottom_chamfer_mm = 0.0       # 45-deg chamfer at piece bottom edges
                              # (G4 escalation vs elephant foot; 0 = off,
                              # try 0.3 if T1 binds at the plate)
poke_hole_d_mm = 18.0         # extraction holes through the floor —
                              # adult-FINGER sized (ahl 2026-09-14: the
                              # poke holes are THE disassembly mechanism;
                              # was 8.0/pushrod-sized). Holes MAY span
                              # piece-piece seams; keep >= 1.5 mm from
                              # frame cavity walls.
rib_interference_mm = 0.05    # LOCKED T3. How deep a crush rib bites
                              # INTO THE MATING FACE (not an offset from
                              # nominal -- see add_crush_ribs): the
                              # retention mechanism, so pieces hold when
                              # tipped and release via the poke holes.
                              # 0 = no ribs.
rib_radius_mm = 0.4           # crush-rib half-cylinder radius
ribs_per_piece = 4            # flat count -- only used for pieces with NO
                              # manual [print.ribs] list (see below);
                              # ahl: few needed, many ribs = hard insertion
min_rib_width_mm = 1.5        # thin-neck floor for the AUTOMATIC placer;
                              # for manual sites it only drives a printed
                              # warning (ahl's placement wins). Protects
                              # necks like the mountains spur just N of
                              # the SF Bay (~0.94 mm, D11) from a rib's
                              # extra interference. Between that neck and
                              # the ~1.5-2.0 mm the pieces otherwise run.
land_min_mm = 0.2             # min land height above datum (color opacity)

[print.ribs]
# MANUAL crush-rib placement (ahl 2026-09-15). The automatic placer kept
# producing surprises (a whole side skipped, two ribs on one spur, every
# slot going to one interface type) because "good rib placement" is a
# judgement about the assembled object, not something a straightness/
# spread proxy captures -- and there are only ~4 ribs per piece. So:
# hand-picked sites, listed here per build+piece.
#
#   - coordinates are APPROXIMATE (x, y) in that build's PRINT mm. Mark
#     them on out/p4_rib_markup.png -- a clean canvas with a labelled
#     10 mm grid, no rib markers, and an exact px<->mm mapping printed
#     by the build. A dot near the perimeter (either side) is enough:
#     each point SNAPS to the nearest spot on that piece's nominal
#     outline. The build prints every snap distance and flags >10 mm as
#     a likely wrong coordinate.
#   - the build also warns (but obeys) if a site lands within 5 mm of a
#     thin neck (marked with a red x on the markup canvas).
#   - DELETE a piece's key to fall back to the automatic placer for that
#     piece; set it to [] for no ribs at all.
#
# An EMPTY list means no ribs at all on that piece (vs. a DELETED key,
# which falls back to the automatic placer).
#
# P4: ahl's HAND-MARKED sites, extracted 2026-09-15 from his annotated
# out/p4_rib_markup.png (blue dots = mountains, orange = valley; exact
# mark colors (116,167,254) / (255,134,71), each blob 57-67 px, centers
# converted at 12 px/mm with origin -8 mm). Valley deliberately gets 6,
# mountains 4. The placer's last automatic picks, if ever wanted as a
# starting point again, were:
#   p4_mountains = [[90.5, 0.0], [56.0, 41.1], [22.8, 92.0], [52.4, 56.9]]
#   p4_valley    = [[85.4, 14.2], [52.0, 100.0], [89.0, 100.0], [100.0, 73.9]]
p4_mountains = [[33.2, 100.3], [28.1, 75.5], [58.0, 53.1], [80.6, 0.2]]
p4_valley = [[55.7, 100.4], [87.5, 100.3], [100.0, 74.6], [99.9, 40.0],
             [75.2, 28.3], [96.1, 0.3]]
# P5: ahl's HAND-MARKED sites, extracted 2026-09-15 from his annotated
# out/p5_rib_markup.png (all ribs marked in ONE colour, #0000FF; the
# piece each belongs to is read from WHICH REGION the dot sits in --
# ahl: "for ribs piece<->piece I put the [dot] inside the region it
# should belong to", i.e. he chose which piece carries each pair rib).
# VALLEY DELIBERATELY HAS NONE: it touches no frame at all in P5, and
# every mountains/valley rib was put on the mountains side, which still
# grips the joint -- a rib bites into the mating face whichever piece
# carries it.
p5_mountains = [[36.6, 240.9], [78.2, 239.7], [97.5, 200.5], [28.1, 179.0],
                [73.3, 172.1], [52.3, 170.3], [82.6, 109.8], [72.7, 89.9],
                [118.2, 89.7], [133.8, 77.2], [169.2, 10.3]]
p5_valley = []
p5_desert = [[133.0, 112.4], [163.8, 108.2], [162.0, 54.9], [196.7, 14.2]]

[print.poke_holes]
# MANUAL finger-hole centres (18 mm, [print].poke_hole_d_mm), keyed
# "p4_<piece>" / "p5_<piece>" -- the same markup loop as the ribs, and
# drawn on the same canvas at TRUE size so a hole and a rib can be
# judged against each other in one pass (ahl 2026-09-15).
#
# Unlike a rib, a hole does NOT snap: an 18 mm circle either fits where
# you put it or it does not, so the build validates instead of nudging.
# It asserts the whole circle clears the frame cavity wall by
# [print].poke_hole_d_mm / POKE_MARGIN_MM, that holes do not crowd each other, and that
# every piece ends up with at least one hole to push it out by.
# Any piece with no list falls back to the automatic planner, so leaving
# this section empty keeps today's behaviour.
#
# P5: ahl's HAND-MARKED centres, extracted 2026-09-15 from his annotated
# out/p5_rib_markup.png (#73FDFF). Keyed by whichever region the centre
# sits in; the build recomputes which pieces each hole actually SERVES
# from geometry, so a hole straddling a seam still credits both.
p5_mountains = [[77.6, 220.0], [34.8, 207.2], [112.3, 125.6], [166.7, 24.5]]
# Second valley hole, third attempt. ahl marked (78.6, 119.4); too
# narrow, so it was moved to the seam at (83.6, 115.0) -- which he then
# X'd out and re-marked at (97.5, 84.3). That does not fit either (6.3
# mm short; the dashed circle crosses out of the valley), so it sits at
# (106.8, 89.3), the nearest spot an 18 mm circle clears the wall, 10.6
# mm from his mark and in a wider part of the valley. The valley is
# barely wider than 2 x (9 + 1.5) mm along most of its length, which is
# why this keeps happening.
p5_valley = [[69.5, 149.6], [106.8, 89.3]]
p5_desert = [[153.6, 97.8], [195.7, 61.9], [194.9, 26.1]]

[key]
# Region-colour KEY, inset into the P5 frame over Nevada (ahl 2026-09-15).
# A rectangular recess in the frame, like a piece cavity, holding a plate
# that lists the five regions with a colour-swatch plug beside each.
#
# PLACEMENT + SIZE are the knobs; everything else derives. Move or resize
# the key and `make p5` re-scans automatically: the key's TOP HEIGHT is
# not configured at all, it is measured from the terrain (see below).
enabled = true
# Centre in P5 print mm (x east, y north; frame is 225.1 x 250.0).
# CONFIRMED by ahl 2026-09-15: "the legend is in a good spot". It also
# sits diagonally opposite the compass rose at (32, 30), which is the
# conventional rose-one-corner / legend-the-other balance.
# Picked by scanning the frame for the largest clear run of
# gray non-CA land: the open block is 106.5 x 95.5 mm at x[114.5, 221]
# y[150.5, 246], and this sits in it at lon/lat (-116.2, 40.3) --
# north-central Nevada, 0% California, 0% water, 14.3 mm clear of the CA
# border, 23+ mm from the print edges.
center_mm = [168.0, 198.0]
# CONFIRMED by ahl 2026-09-15 ("the size looks fine"), along with the
# centre above -- the key is FINAL.
# Sized for the title layout: the text column must fit "California" at
# the 6 mm title cap (44.6 mm), which sets the width; a 2-line title +
# gap + five 5 mm-pocket rows sets the height. The build asserts both,
# so a too-small key fails rather than crowds. If the width ever needs
# to come down, the only lever is the title cap (6.0 -> 66.6 mm min,
# 5.0 -> 59.2, 4.5 -> 55.5); height barely moves, being set by the
# pocket rows.
width_mm = 68.0
height_mm = 66.0
# NO height knob, by design: the build walks the key's BOUNDARY, takes
# the tallest terrain it actually meets there, and sets the top flush
# with it -- so the plate finishes level with the ground it abuts, and
# moving or resizing the key re-heights it on the next `make p5`.
# ("adjacent" means on the boundary line, not merely nearby -- ahl
# 2026-09-15.) The bottom always sits on the tray floor at the same z as
# the other pieces.
# PERMANENT press fit (ahl 2026-09-15): no poke-hole under it, no crush
# ribs -- the key is a legend that never needs to come out, glue
# optional. The plate is grown by this much TOTAL over the recess
# (half per side) for the interference. Drop to 0 (or negative, which
# becomes clearance) if it will not seat.
interference_mm = 0.05
# Swatch pockets. Plug dimensions are deliberately NOT fixed here yet --
# ahl 2026-09-15: decide them after test-fitting out/key_coupon/
# {pocket_coupon,plug}.stl. The pockets themselves are cut
# now so the key geometry is final.
# 5 mm swatches (ahl 2026-09-15) -- smaller, to match the smaller region
# text under the title. NOTE this supersedes the 7 mm the pocket coupon
# was generated at; regenerate out/key_coupon/ before test-fitting.
pocket_d_mm = 5.0
pocket_depth_mm = 1.4
# POKE HOLE through each swatch pocket's floor (ahl 2026-09-15): if a
# plug goes into the wrong pocket, push it back out from underneath.
# Only useful while the key is still loose -- it is press-fit
# permanently into the frame and, by ahl's call, does not need to be
# recoverable after that, so nothing is drilled through the frame. The
# plugs are fitted before the key is installed, which is when a mistake
# would happen. 0 = blind pockets, no hole.
plug_poke_d_mm = 2.5
# The PLUGS that drop into those pockets.
# The POCKET size above is a DESIGN dimension -- the key's row layout is
# built around it -- so it is NOT a fit knob. Fit is tuned on the plug
# alone, and plug_d_mm is therefore an absolute diameter rather than an
# offset from the pocket (ahl 2026-09-15: "just pick the pocket size and
# we'll try several plugs").
#   plug height = pocket_depth_mm + plug_proud_mm
# The plug is a plain flat-topped CYLINDER, never domed -- a dome at this
# size just prints as ridge lines. plug_proud_mm is only how far the flat
# top stands above the plate; you feel the step at its rim.
#
# MEASURED from the fit ladder (ahl 2026-09-15), not guessed. Result:
#   4.70 / 4.75 / 4.80  fell out
#   4.85 / 4.90         went in, solid
#   4.95                went in, took some effort
#   5.00                would not go in
# So the working band is 4.85-4.95 and 4.90 is its CENTRE -- 0.05 mm of
# margin on both sides. That margin is the point: the real key has FIVE
# pockets, and pocket-to-pocket and print-to-print variation eats into
# it, so the edges of the band (4.85, one step from falling out; 4.95,
# one step from not fitting) are not safe picks.
# An earlier 5.05 mm plug (designed INTERFERENCE) was far too tight and
# deformed when forced -- the pocket prints undersize, so the usable
# range sits below nominal.
plug_d_mm = 4.90
plug_proud_mm = 0.4
# Title + region text. Title cap matches the compass rose's N/E/S/W
# letters ([compass].letter_cap_mm); it wraps over as many lines as the
# text column needs ("California" / "Regions" at 66 mm wide).
title = "California Regions"
title_cap_mm = 6.0
title_gap_mm = 4.0
# Printed-insert margins: blank border inside the cut line (so type is
# not flush to the paper edge) and spare paper outside it to hold while
# trimming. The border comes out of the usable text column, which is
# why width_mm went 66 -> 68: "California" at the 6 mm title cap is
# 44.6 mm and would not fit a bordered 48 mm column.
insert_border_mm = 2.0
insert_bleed_mm = 5.0
label_cap_mm = 3.0
# Shallow recess for the 2D-PRINTED label (see key_panel.py: FDM at this
# text size fights the nozzle, so the labels are printed on paper/vinyl).
label_recess_mm = 0.2

[compass]
# D17 compass rose — ahl's Illustrator artwork (assets/compass.svg;
# source compass.ai at repo root; symmetry verified <=0.5% under the
# full dihedral group 2026-09-14). Color -> filament mapping: teal
# (39,170,225) -> water (no body), dark blue (46,49,146) -> CA-land
# filament, gray (193,199,210) -> gray, black -> black. Lettering
# (N/E/S/W) added by the pipeline in black, independent of artwork.
# Style FLUSH per ahl 2026-09-14 ("if the black outline is challenging
# to print, do it flush"): the ~0.5 mm black outlines as raised
# free-standing ridges were the print risk, so ALL ink colors are
# inlaid with tops level with the water surface. "raised" remains
# available as a switch. Goes on BOTH the P5 final frame and the P4
# test frame.
enabled = true
svg = "assets/compass.svg"
# T1 print verdict (ahl 2026-09-14): gray+blue read nicely on the water;
# FLUSH inlay left visible under-fill (slicer leaves a hairline gap at
# the coincident inlay/recess walls) -> T2 tries RAISED: rose painted ON
# TOP of the ocean. v2 artwork has no thin black outlines, so raised is
# now safe. 2 layers (0.4) over 1 to beat PLA translucency of the teal
# underneath (drop to 0.2 for subtler if desired).
style = "raised"              # "flush" (inlaid, level tops) | "raised"
depth_mm = 0.4                # inlay depth / raise height (2 layers)
letter_font = "Georgia Bold"
letter_cap_mm = 6.0           # T1: letters ok but E was toughest ->
                              # ahl +50% (was 4.0)
letter_radius_frac = 1.65     # letter anchor radius / ring outer radius.
                              # MUST exceed 1.30 (cardinal tips reach 30%
                              # past the ring): ahl 2026-09-14, points
                              # must not touch the letters. compass_art.py
                              # build-time asserts a POSITIVE gap between
                              # the rasterized letter glyph ink (actual
                              # pixels, post its own min-stroke dilation)
                              # and the cardinal tips (measured after
                              # ink_min_stroke_mm dilation too). At 1.45
                              # this failed (gap -1.97 mm against the v1
                              # outlined artwork); 1.65 clears it (+0.35
                              # mm against the current v2 artwork, dia 25).
ink_min_stroke_mm = 0.45      # dilate artwork ink classes (priority
                              # black > coast > gray, disjoint by
                              # construction; SURGICAL growth only where
                              # the opening test finds ink too thin) to
                              # at least this printed width, same test as
                              # the letters. The v2 artwork (black ring +
                              # black center, no thin outlines) already
                              # clears it raw at dia 25 (black 2.00 mm,
                              # coast/gray 0.55 mm each -- 0 dilation
                              # steps needed); kept as a hard floor for
                              # future artwork edits, with black asserted
                              # (it has no neighbor that can pinch it) and
                              # coast/gray best-effort + reported (they
                              # can be geometrically boxed in by black at
                              # a sharp taper on a thinner-outlined
                              # design, per compass_art.py's comments).
diameter_mm = 25.0            # outer-ring diameter (ahl 2026-09-14:
                              # half the previous 50)
# P5 final frame placement (mm from Frame SW corner). History: [48, 55]
# clipped the mountains cavity and Point Conception coast -> moved SW;
# [43, 45] had W ink closer to its edge (17.13 mm) than S ink to its
# edge (21.06 mm) -- true ink extent (not the letters bbox) is 25.87 mm
# west / 23.94 mm south of center; [43, 41.1] equalized those (~17.1 mm
# each). LOCKED IN (ahl 2026-09-14): [32, 30] -- pulled in tight to the
# SW corner (W/S clearance ~6.1 mm each, still balanced; ink-hull
# margins to coast/gray/cavities all grew vs. [43, 41.1], so still
# clear of everything). Does not affect the P4 coupon (its own
# coupon_center_mm).
center_mm = [32.0, 30.0]
# P4 mini-frame placement (mm from coupon SW corner) + smaller diameter
# for the coupon's tighter Pacific. Was [30, 35] @ 50: the artwork +
# letters box (~76 mm at dia 50) cannot fit the coupon's ocean pocket
# anywhere. RAISED style fit dia 36 @ [22, 28] (ink-over-sea only), but
# FLUSH also needs the full letters box clear of the piece cavities
# (the water-top recess panel) -- p4 build 2026-09-14 searched the
# ladder 36/34/32: largest flush-valid is dia 32 here, panel >= 1 mm
# from cavities and all ink >= 1.2 mm from land.
# At dia 25 the coupon can carry the rose at FULL final size — the test
# now validates the exact printed rose.
coupon_center_mm = [19.7, 28.3]
coupon_diameter_mm = 25.0

[islands]
# D15 (ahl, 2026-09-13): the islands PIECE is SCRAPPED — the Channel
